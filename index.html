<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards</title>
  <style>
    :root {
      --bg: #f0f0f0;
      --surface: #ffffff;
      --text: #1a1a1a;
      --text-muted: #777;
      --border: #e0e0e0;
      --primary: #2563eb;
      --known: #16a34a;
      --unknown: #dc2626;
      --shadow: 0 4px 24px rgba(0,0,0,0.10);
      --accent-interview: #0d9488;
      --accent-interview-light: #ccfbf1;
      --accent-interview-border: #5eead4;
      --accent-language: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111111;
        --surface: #1e1e1e;
        --text: #e5e5e5;
        --text-muted: #888;
        --border: #303030;
        --primary: #3b82f6;
        --known: #22c55e;
        --unknown: #ef4444;
        --shadow: 0 4px 24px rgba(0,0,0,0.45);
        --accent-interview: #2dd4bf;
        --accent-interview-light: #042f2e;
        --accent-interview-border: #0d9488;
        --accent-language: #3b82f6;
      }
    }

    /* Interview mode theme override */
    body.mode-interview { --primary: var(--accent-interview); }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { overflow-x: hidden; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }

    nav { display: flex; gap: 4px; align-items: center; }
    nav button {
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.15s;
    }
    nav button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .reset-btn {
      font-size: 16px;
      color: var(--text-muted);
      background: none;
      border: 1px solid var(--border);
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 20px;
      line-height: 1;
      min-width: 40px;
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .reset-btn:hover { color: var(--unknown); border-color: var(--unknown); }
    .reset-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
    }

    /* ── Setup ── */
    .setup { width: 100%; }
    .setup-back {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      padding: 0;
      margin-bottom: 20px;
    }
    .setup-back:hover { color: var(--text); }
    .setup h2 { font-size: 22px; margin-bottom: 8px; }
    .setup p { color: var(--text-muted); font-size: 14px; line-height: 1.6; margin-bottom: 22px; }
    .setup a { color: var(--primary); }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 6px; }
    .form-group input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus { border-color: var(--primary); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-known   { background: var(--known);   color: #fff; }
    .btn-unknown { background: var(--unknown); color: #fff; }
    .btn-full { width: 100%; }

    .error-banner {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #991b1b;
      padding: 11px 15px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      width: 100%;
    }
    @media (prefers-color-scheme: dark) {
      .error-banner { background: #3b0a0a; border-color: #7f1d1d; color: #fca5a5; }
    }

    /* ── Study ── */
    .study-area { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 18px; }

    /* Filter + shuffle bar */
    .controls-bar {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .controls-actions {
      display: flex;
      gap: 8px;
    }
    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding-bottom: 2px;
    }
    .fpill {
      flex-shrink: 0;
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      min-height: 36px;
    }
    .fpill.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .shuffle-btn {
      flex-shrink: 0;
      padding: 5px 13px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .shuffle-btn.active { background: #7c3aed; color: #fff; border-color: #7c3aed; }

    .stats-bar {
      width: 100%;
      display: flex;
      gap: 10px;
      font-size: 13px;
      color: var(--text-muted);
      align-items: center;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 500;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
    .dot.k { background: var(--known); }
    .dot.u { background: var(--unknown); }
    .dot.n { background: var(--text-muted); }

    /* Card flip */
    .card-container { width: 100%; perspective: 1000px; }
    .card {
      width: 100%;
      min-height: 210px;
      display: grid;
      transform-style: preserve-3d;
      transition: transform 0.45s cubic-bezier(.4,0,.2,1);
      cursor: pointer;
    }
    .card.flipped { transform: rotateY(180deg); }
    .card-face {
      grid-area: 1 / 1;
      width: 100%;
      min-height: 210px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px 28px;
      background: var(--surface);
      border-radius: 18px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      user-select: none;
    }
    .card-back { transform: rotateY(180deg); }
    .card-lang {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 14px;
      font-weight: 600;
    }
    .card-word {
      font-size: 30px;
      font-weight: 700;
      text-align: center;
      line-height: 1.25;
      letter-spacing: -0.5px;
      word-break: break-word;
    }
    .card-hint { margin-top: 14px; font-size: 12px; color: var(--text-muted); }
    .card-tag {
      margin-top: 16px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      background: var(--bg);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .action-row { width: 100%; display: flex; gap: 10px; }
    .action-row .btn { flex: 1; padding: 15px; font-size: 16px; }

    .skip-btn {
      font-size: 14px;
      color: var(--text-muted);
      background: none;
      border: 1px solid var(--border);
      border-radius: 20px;
      cursor: pointer;
      padding: 10px 24px;
      min-height: 44px;
      transition: all 0.15s;
    }
    .skip-btn:hover { color: var(--text); border-color: var(--text-muted); }

    .empty-state { text-align: center; padding: 56px 0; color: var(--text-muted); }
    .empty-state h3 { font-size: 18px; color: var(--text); margin-bottom: 8px; }

    .saving { font-size: 12px; color: var(--text-muted); height: 16px; text-align: center; width: 100%; }

    .idle-banner {
      width: 100%;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      color: #9a3412;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .idle-banner button { background: none; border: none; cursor: pointer; font-size: 16px; color: inherit; line-height: 1; padding: 0 2px; }
    @media (prefers-color-scheme: dark) {
      .idle-banner { background: #431407; border-color: #9a3412; color: #fed7aa; }
    }

    .session-pill {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      font-size: 12px;
      font-weight: 500;
      padding: 4px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
    }
    .session-sep { color: var(--border); }
    .reset-session-btn {
      flex-shrink: 0;
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      padding: 3px 9px;
      border-radius: 20px;
      transition: all 0.15s;
      line-height: 1.4;
    }
    .reset-session-btn:hover { color: var(--primary); border-color: var(--primary); }

    /* ── Manage ── */
    .manage-area { width: 100%; display: flex; flex-direction: column; gap: 18px; }

    .add-form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
    }
    .add-form h3 { font-size: 14px; font-weight: 700; margin-bottom: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; margin-bottom: 12px; }

    .import-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .import-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      cursor: pointer;
      user-select: none;
    }
    .import-header:hover { background: var(--bg); }
    .import-header span { font-size: 14px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .import-header .chevron { font-size: 12px; color: var(--text-muted); transition: transform 0.2s; }
    .import-header .chevron.open { transform: rotate(180deg); }
    .import-body { padding: 0 18px 18px; border-top: 1px solid var(--border); }
    .import-body p { font-size: 12px; color: var(--text-muted); margin: 12px 0 10px; line-height: 1.5; }
    .import-body code { font-family: monospace; background: var(--bg); padding: 1px 4px; border-radius: 3px; font-size: 11px; }
    .import-or { text-align: center; font-size: 12px; color: var(--text-muted); margin: 10px 0; }
    .import-textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-family: monospace;
      resize: vertical;
      min-height: 90px;
      outline: none;
    }
    .import-textarea:focus { border-color: var(--primary); }
    .import-file-btn {
      display: block;
      width: 100%;
      padding: 10px;
      border: 2px dashed var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .import-file-btn:hover { border-color: var(--primary); color: var(--primary); }
    .import-msg-ok  { font-size: 13px; color: var(--known);   margin-top: 10px; font-weight: 500; }
    .import-msg-err { font-size: 13px; color: var(--unknown); margin-top: 10px; font-weight: 500; }

    .manage-controls { display: flex; align-items: center; justify-content: space-between; }
    .section-title { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .manage-filter { display: flex; flex-wrap: wrap; gap: 6px; }

    .cards-list { display: flex; flex-direction: column; gap: 8px; }
    .card-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .card-item-text { flex: 1; min-width: 0; }
    .card-item-en { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-item-ru { font-size: 13px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-item-meta { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
    .label-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      background: var(--bg);
      color: var(--text-muted);
      border: 1px solid var(--border);
      white-space: nowrap;
    }
    .sit-badge { background: #ede9fe; color: #6d28d9; border-color: #c4b5fd; }
    @media (prefers-color-scheme: dark) { .sit-badge { background: #2e1065; color: #a78bfa; border-color: #4c1d95; } }
    .card-item-score { font-size: 12px; color: var(--text-muted); white-space: nowrap; flex-shrink: 0; }
    .s-k { color: var(--known); }
    .s-u { color: var(--unknown); }
    .del-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
      padding: 8px 10px;
      min-width: 40px;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: color 0.15s, background 0.15s;
      flex-shrink: 0;
    }
    .del-btn:hover { color: var(--unknown); background: rgba(220,38,38,0.08); }

    /* Progress bar for shuffle mode */
    .progress-wrap {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .progress-bar-wrap {
      flex: 1;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: #7c3aed;
      border-radius: 2px;
      transition: width 0.3s;
    }
    .progress-count {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Stopwatch ── */
    .stopwatch {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 10px 0 2px;
      border-top: 1px solid var(--border);
      margin-top: 4px;
    }
    .stopwatch-time {
      font-size: 15px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      min-width: 64px;
      text-align: center;
    }
    .sw-btn {
      padding: 4px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .sw-btn:hover { border-color: var(--primary); color: var(--primary); }
    .sw-btn.running { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* Pagination */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 4px 0;
    }
    .page-btn {
      padding: 8px 18px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      min-height: 40px;
      min-width: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .page-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
    .page-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .page-info { font-size: 13px; color: var(--text-muted); }

    /* ── Stats ── */
    .stats-area { width: 100%; display: flex; flex-direction: column; gap: 16px; }
    .chart-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 12px 12px;
    }
    .chart-title { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
    .chart-legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-muted); margin-top: 10px; align-items: center; }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; flex-shrink: 0; }
    .summary-row { display: flex; gap: 8px; }
    .summary-card { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 8px; text-align: center; }
    .summary-card .s-val { font-size: 20px; font-weight: 700; display: block; }
    .summary-card .s-lbl { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; display: block; margin-top: 3px; }
    .metric-tabs { display: flex; gap: 6px; }

    /* ── Interview mode ── */
    .int-badge { background: #eff6ff; color: #1d4ed8; border-color: #93c5fd; }
    @media (prefers-color-scheme: dark) { .int-badge { background: #1e3a5f; color: #60a5fa; border-color: #1d4ed8; } }

    .diff-easy   { background: #f0fdf4; color: #15803d; border-color: #86efac; }
    .diff-medium { background: #fefce8; color: #a16207; border-color: #fde047; }
    .diff-hard   { background: #fef2f2; color: #b91c1c; border-color: #fca5a5; }
    @media (prefers-color-scheme: dark) {
      .diff-easy   { background: #14532d; color: #86efac; border-color: #15803d; }
      .diff-medium { background: #422006; color: #fde047; border-color: #a16207; }
      .diff-hard   { background: #450a0a; color: #fca5a5; border-color: #b91c1c; }
    }

    .card-word-question {
      font-size: 20px;
      font-weight: 600;
      text-align: left;
      line-height: 1.4;
      width: 100%;
    }
    .card-word-long {
      font-size: 15px;
      font-weight: 400;
      text-align: left;
      line-height: 1.6;
      letter-spacing: 0;
      max-height: 300px;
      overflow-y: auto;
      width: 100%;
      white-space: pre-line;
    }
    .interview-card .card-face {
      min-height: 280px;
      padding: 28px 24px;
      justify-content: flex-start;
    }

    .bookmark-icon {
      position: absolute;
      top: 12px;
      right: 14px;
      font-size: 18px;
      cursor: pointer;
      color: var(--text-muted);
      background: none;
      border: none;
      padding: 2px;
      line-height: 1;
      z-index: 2;
      transition: color 0.15s;
    }
    .bookmark-icon:hover { color: var(--primary); }
    .bookmark-icon.active { color: #f59e0b; }

    .card-container { position: relative; }

    .card-badges { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; }

    .btn-partial { background: #f59e0b; color: #fff; }

    .action-row-3 { width: 100%; display: flex; gap: 8px; }
    .action-row-3 .btn { flex: 1; padding: 13px 8px; font-size: 14px; }

    .practice-indicator {
      width: 100%;
      text-align: center;
      font-size: 12px;
      color: #f59e0b;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ── Mode chooser ── */
    .mode-chooser {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-top: 24px;
    }
    .mode-chooser h2 {
      font-size: 22px;
      text-align: center;
      margin-bottom: 8px;
    }
    .mode-chooser p {
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 12px;
    }
    .mode-card {
      width: 100%;
      padding: 28px 24px;
      border-radius: 18px;
      border: 2px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .mode-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .mode-card-icon { font-size: 32px; }
    .mode-card h3 { font-size: 18px; font-weight: 700; }
    .mode-card p { text-align: left; font-size: 13px; color: var(--text-muted); line-height: 1.5; margin: 0; }
    .mode-card-lang { border-color: var(--accent-language); }
    .mode-card-lang:hover { border-color: var(--accent-language); }
    .mode-card-lang h3 { color: var(--accent-language); }
    .mode-card-interview { border-color: var(--accent-interview); }
    .mode-card-interview:hover { border-color: var(--accent-interview); }
    .mode-card-interview h3 { color: var(--accent-interview); }

    .header-back {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      font-weight: 500;
      padding: 8px 10px;
      margin-right: 2px;
      border-radius: 8px;
      min-width: 40px;
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s;
    }
    .header-back:hover { color: var(--text); }
    .header-title-row { display: flex; align-items: center; }

    .card-resource {
      margin-top: 14px;
      width: 100%;
      text-align: left;
    }
    .card-resource a {
      font-size: 12px;
      color: var(--primary);
      text-decoration: none;
      word-break: break-all;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .card-resource a:hover { text-decoration: underline; }

    /* ── Swipe gesture feedback ── */
    .card-container.swiping .card {
      transition: none;
    }
    .swipe-hint {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 8px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
      z-index: 5;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .swipe-hint-right { right: 12px; background: var(--known); color: #fff; }
    .swipe-hint-left { left: 12px; background: var(--unknown); color: #fff; }
    .swipe-hint-up { top: 12px; left: 50%; transform: translateX(-50%); background: #f59e0b; color: #fff; }
    .swipe-hint.visible { opacity: 1; }

    /* ── Session progress bar ── */
    .session-progress {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .session-progress-bar {
      flex: 1;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    .session-progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 2px;
      transition: width 0.3s;
    }
    .session-progress-text {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Pull to refresh ── */
    .ptr-indicator {
      width: 100%;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      padding: 8px 0;
      transition: opacity 0.2s;
    }

    .diff-filter-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

    .bookmark-list-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: var(--text-muted);
      padding: 2px 4px;
      line-height: 1;
      transition: color 0.15s;
    }
    .bookmark-list-btn:hover { color: #f59e0b; }
    .bookmark-list-btn.active { color: #f59e0b; }

    /* ── Mobile adjustments (≤ 480px) ── */
    @media (max-width: 480px) {
      header { padding: 8px 10px; }
      header h1 { font-size: 15px; }
      nav {
        overflow-x: auto;
        flex-wrap: nowrap;
        scrollbar-width: none;
      }
      nav::-webkit-scrollbar { display: none; }
      nav button { padding: 8px 10px; font-size: 13px; flex-shrink: 0; min-height: 36px; }
      main { padding: 14px 10px 28px; }
      .card-face { padding: 24px 20px; }
      .card-word { font-size: 22px; }
      .card-word-question { font-size: 17px; }
      .card-word-long { font-size: 14px; max-height: 250px; }
      .interview-card .card-face { min-height: 240px; }
      .action-row .btn { padding: 14px; font-size: 15px; min-height: 48px; }
      .action-row-3 .btn { padding: 12px 8px; font-size: 14px; min-height: 48px; }
      .add-form { padding: 14px; }
      .form-row { flex-direction: column; gap: 8px; }
      .import-body { padding: 0 12px 14px; }
      .filter-pills, .manage-filter, .diff-filter-row {
        flex-wrap: nowrap;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .filter-pills::-webkit-scrollbar, .manage-filter::-webkit-scrollbar, .diff-filter-row::-webkit-scrollbar { display: none; }
      .fpill { flex-shrink: 0; }
      .summary-row { flex-wrap: wrap; }
      .summary-card { min-width: calc(33% - 6px); }
      .skip-btn { width: 100%; text-align: center; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Flashcards</h1>
    <nav id="main-nav">
      <button id="btn-study" class="active" onclick="showView('study')">Study</button>
      <button id="btn-manage" onclick="showView('manage')">Cards</button>
    </nav>
  </header>
  <main id="root"></main>

<script>
var S = {
  token:        localStorage.getItem('fc_token') || '',
  gistId:       localStorage.getItem('fc_gist_id') || '',
  appMode:      localStorage.getItem('fc_appMode') || '',  // '' | 'language' | 'interview'
  cards:        [],
  current:      null,
  lastId:       null,
  flipped:      false,
  saving:       false,
  view:         'study',
  err:          '',
  filterLabel:  '',       // '' = all; study mode filter
  manageFilter: '',       // manage list filter
  shuffleMode:  false,
  shuffleQueue: [],       // remaining ids in shuffle round
  direction:    'en-ru', // 'en-ru' | 'ru-en'
  importOpen:   false,
  importMsg:    '',       // feedback after import
  addMsg:       '',       // feedback from add-card form
  managePage:   0,       // current page in the manage list
  sessionKnown:   0,     // "Know it" clicks this session
  sessionUnknown: 0,     // "Don't know" clicks this session
  sessionKnownIds: {},   // {[id]: true} cards not to show again this session
  studyMode:  'vocab',   // 'vocab' | 'situation'
  addType:    'vocab',   // type selected in the add-card form
  manageTypeFilter: '',  // '' | 'vocab' | 'situation'
  swRunning:   false,    // stopwatch running?
  swElapsed:   0,        // ms accumulated before last start
  swStarted:   0,        // Date.now() when last started
  statsPeriod: 7,        // days shown in chart: 7 | 14 | 30
  statsMode:   '',       // filter: '' | 'vocab' | 'situation'
  statsMetric:  'cards',  // 'cards' | 'time'
  idleNote:     false,    // true when auto-paused due to inactivity
  idleTimeout:  parseInt(localStorage.getItem('fc_idle') || '60', 10), // seconds; 0 = off
  difficultyFilter: '',  // '' | 'easy' | 'medium' | 'hard'
  bookmarkFilter: false, // show only bookmarked cards
  practiceMode: false    // no-scoring study mode
};

var stats = JSON.parse(localStorage.getItem('fc_stats') || '[]');

// ── Gist API ─────────────────────────────────────────────────────────────────

function hdrs() {
  return {
    'Authorization': 'token ' + S.token,
    'Content-Type': 'application/json',
    'Accept': 'application/vnd.github.v3+json'
  };
}

function mergeStats(a, b) {
  var seen = {}, out = [];
  a.concat(b).forEach(function(r) {
    var k = r.date + '|' + r.duration + '|' + r.known + '|' + r.unknown + '|' + r.mode;
    if (!seen[k]) { seen[k] = true; out.push(r); }
  });
  return out.sort(function(a, b) { return a.date < b.date ? -1 : 1; });
}

function saveGistRequest() {
  return fetch('https://api.github.com/gists/' + S.gistId, {
    method: 'PATCH',
    headers: hdrs(),
    body: JSON.stringify({ files: { 'flashcards.json': { content: JSON.stringify({ cards: S.cards, stats: stats }, null, 2) } } })
  }).then(function(r) {
    if (!r.ok) throw new Error('Sync error ' + r.status);
    S.saving = false;
    renderSaving();
  });
}

function showSaveError(msg) {
  S.saving = false;
  var el = document.getElementById('saving-lbl');
  if (el) el.textContent = msg;
  setTimeout(function() {
    var el2 = document.getElementById('saving-lbl');
    if (el2) el2.textContent = '';
  }, 5000);
}

function saveGist() {
  if (!S.token || !S.gistId) return Promise.resolve();
  S.saving = true; renderSaving();
  return saveGistRequest().catch(function() {
    return new Promise(function(res) { setTimeout(res, 3000); })
      .then(saveGistRequest)
      .catch(function(e) { showSaveError(e.message); });
  });
}

var saveTimer = null;
function scheduleSave() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(saveGist, 900);
}

function loadGist() {
  return fetch('https://api.github.com/gists/' + S.gistId, { headers: hdrs() })
    .then(function(r) { if (!r.ok) throw new Error('Load failed ' + r.status); return r.json(); })
    .then(function(d) {
      var f = d.files['flashcards.json'];
      if (f) {
        var data = JSON.parse(f.content);
        S.cards = data.cards || [];
        if (Array.isArray(data.stats)) {
          stats = mergeStats(stats, data.stats);
          localStorage.setItem('fc_stats', JSON.stringify(stats));
        }
      }
    });
}

function createGist() {
  return fetch('https://api.github.com/gists', {
    method: 'POST', headers: hdrs(),
    body: JSON.stringify({ description: 'Flashcards App Data', public: false,
      files: { 'flashcards.json': { content: JSON.stringify({ cards: [], stats: [] }, null, 2) } } })
  }).then(function(r) { if (!r.ok) throw new Error('Create gist failed ' + r.status); return r.json(); })
    .then(function(d) { S.gistId = d.id; localStorage.setItem('fc_gist_id', d.id); });
}

function initGist() {
  return fetch('https://api.github.com/gists?per_page=100', { headers: hdrs() })
    .then(function(r) { if (!r.ok) throw new Error('Auth failed ' + r.status); return r.json(); })
    .then(function(list) {
      var found = list.find(function(g) { return g.description === 'Flashcards App Data' && g.files['flashcards.json']; });
      if (found) { S.gistId = found.id; localStorage.setItem('fc_gist_id', found.id); return loadGist(); }
      else return createGist();
    });
}

// ── Card logic ────────────────────────────────────────────────────────────────

function isSituation(c) { return c.type === 'situation'; }
function isVocab(c)     { return !c.type || c.type === 'vocab'; }
function isInterview(c)  { return c.type === 'interview'; }

function filteredPool() {
  var typeOk = S.studyMode === 'situation' ? isSituation
             : S.studyMode === 'interview' ? isInterview
             : isVocab;
  var pool = S.cards.filter(function(c) {
    if (!typeOk(c)) return false;
    if (S.filterLabel && c.label !== S.filterLabel) return false;
    if (S.studyMode === 'interview' && S.difficultyFilter && (c.difficulty || 'medium') !== S.difficultyFilter) return false;
    if (S.studyMode === 'interview' && S.bookmarkFilter && !c.bookmarked) return false;
    return true;
  });
  return pool.filter(function(c) { return !S.sessionKnownIds[c.id]; });
}

function weight(c) {
  var k = c.known || 0, u = c.unknown || 0;
  if (!k && !u) return 4;
  if (u > k) return u - k + 2;
  return 1;
}

function shuffleArray(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function buildShuffleQueue() {
  var pool = filteredPool();
  S.shuffleQueue = shuffleArray(pool.map(function(c) { return c.id; }));
}

function nextCard() {
  var pool = filteredPool();
  if (!pool.length) return null;

  if (S.shuffleMode) {
    // Keep queue in sync with current pool
    var poolIds = pool.map(function(c) { return c.id; });
    S.shuffleQueue = S.shuffleQueue.filter(function(id) { return poolIds.indexOf(id) !== -1; });
    if (!S.shuffleQueue.length) buildShuffleQueue();

    // Try to avoid repeating the last card
    var candidates = S.shuffleQueue.filter(function(id) { return id !== S.lastId; });
    if (!candidates.length) candidates = S.shuffleQueue;
    var nextId = candidates[0];
    S.shuffleQueue = S.shuffleQueue.filter(function(id) { return id !== nextId; });
    return pool.find(function(c) { return c.id === nextId; }) || pool[0];
  }

  // Weighted random
  var exclude = pool.length > 1 ? pool.filter(function(c) { return c.id !== S.lastId; }) : pool;
  if (!exclude.length) exclude = pool;
  var total = exclude.reduce(function(s, c) { return s + weight(c); }, 0);
  var r = Math.random() * total, cum = 0;
  for (var i = 0; i < exclude.length; i++) { cum += weight(exclude[i]); if (r < cum) return exclude[i]; }
  return exclude[exclude.length - 1];
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function uniqueLabels(typeFilter) {
  var seen = {}, labels = [];
  var typeOk = typeFilter === 'situation' ? isSituation
             : typeFilter === 'interview' ? isInterview
             : typeFilter === 'vocab' ? isVocab
             : function() { return true; };
  S.cards.filter(typeOk).forEach(function(c) {
    if (c.label && !seen[c.label]) { seen[c.label] = true; labels.push(c.label); }
  });
  return labels.sort();
}

function addCard(en, ru, label, type, difficulty, resource) {
  var t = (type === 'situation' || type === 'interview') ? type : 'vocab';
  var preserveCase = (t === 'situation' || t === 'interview');
  var enNorm = preserveCase ? en.trim() : en.trim().toLowerCase();
  var ruNorm = preserveCase ? ru.trim() : ru.trim().toLowerCase();
  var dup = S.cards.some(function(x) {
    return x.type === t && x.english.toLowerCase() === enNorm.toLowerCase();
  });
  if (dup) return false;
  var c = { id: uid(), english: enNorm, russian: ruNorm, label: (label || '').trim(), known: 0, unknown: 0, type: t };
  if (t === 'interview') {
    c.difficulty = difficulty || 'medium';
    c.bookmarked = false;
    if (resource) c.resource = resource.trim();
  }
  S.cards.push(c);
  if (!S.current && S.studyMode === t) S.current = c;
  scheduleSave();
  return true;
}

function delCard(id) {
  S.cards = S.cards.filter(function(c) { return c.id !== id; });
  S.shuffleQueue = S.shuffleQueue.filter(function(qid) { return qid !== id; });
  if (S.current && S.current.id === id) { S.current = nextCard(); S.flipped = false; }
  scheduleSave();
  render();
}

function markCard(known) {
  if (!S.current) return;
  if (known) { S.current.known = (S.current.known || 0) + 1; S.sessionKnown++; S.sessionKnownIds[S.current.id] = true; }
  else { S.current.unknown = (S.current.unknown || 0) + 1; S.sessionUnknown++; }
  S.lastId = S.current.id;
  S.current = nextCard();
  S.flipped = false;
  resetIdleTimer();
  scheduleSave();
  render();
}

// 3-level confidence for interview mode
function markInterview(level) {
  if (!S.current) return;
  if (level === 'nailed') {
    S.current.known = (S.current.known || 0) + 2;
    S.sessionKnown++;
    S.sessionKnownIds[S.current.id] = true;
  } else if (level === 'partial') {
    S.current.known = (S.current.known || 0) + 1;
    S.current.unknown = (S.current.unknown || 0) + 1;
    S.sessionKnown++;
  } else {
    S.current.unknown = (S.current.unknown || 0) + 2;
    S.sessionUnknown++;
  }
  S.lastId = S.current.id;
  S.current = nextCard();
  S.flipped = false;
  resetIdleTimer();
  scheduleSave();
  render();
}

function toggleBookmark(id) {
  var card = S.cards.find(function(c) { return c.id === id; });
  if (card) {
    card.bookmarked = !card.bookmarked;
    scheduleSave();
    render();
  }
}

function practiceNext() {
  S.lastId = S.current ? S.current.id : null;
  S.current = nextCard();
  S.flipped = false;
  resetIdleTimer();
  render();
}

// ── Render ────────────────────────────────────────────────────────────────────

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderSaving() {
  var el = document.getElementById('saving-lbl');
  if (el) el.textContent = S.saving ? 'Saving…' : '';
}

function applyModeTheme() {
  document.body.classList.toggle('mode-interview', S.appMode === 'interview');
  var h1 = document.querySelector('header h1');
  if (!h1) return;
  if (S.appMode === 'interview') {
    h1.parentNode.querySelector('.header-title-row') ||
      (function() {
        var row = document.createElement('div');
        row.className = 'header-title-row';
        h1.parentNode.insertBefore(row, h1);
        row.appendChild(h1);
      })();
  }
}

function render() {
  var root = document.getElementById('root');
  if (S.view === 'token' && !S.token) { S.view = 'study'; }
  if (!S.token || S.view === 'token') { root.innerHTML = renderSetup(); applyModeTheme(); return; }
  if (!S.appMode) { root.innerHTML = renderModeChooser(); applyModeTheme(); return; }
  root.innerHTML = S.view === 'study'  ? renderStudy()  :
                   S.view === 'manage' ? renderManage() :
                   S.view === 'stats'  ? renderStats()  : renderSetup();
  applyModeTheme();
}

function renderModeChooser() {
  var intCount = S.cards.filter(isInterview).length;
  var langCount = S.cards.filter(function(c) { return isVocab(c) || isSituation(c); }).length;
  return '<div class="mode-chooser">' +
    '<h2>What would you like to study?</h2>' +
    '<p>Choose your learning mode</p>' +
    '<div class="mode-card mode-card-interview" onclick="enterAppMode(\'interview\')">' +
      '<div class="mode-card-icon">🎯</div>' +
      '<h3>Interview Prep</h3>' +
      '<p>Technical Q&A for job interviews — Kubernetes, Linux, networking, storage, and more.' +
        (intCount ? ' <strong>' + intCount + ' questions</strong> ready.' : '') + '</p>' +
    '</div>' +
    '<div class="mode-card mode-card-lang" onclick="enterAppMode(\'language\')">' +
      '<div class="mode-card-icon">🗣</div>' +
      '<h3>Language Learning</h3>' +
      '<p>Vocabulary flashcards and situation practice.' +
        (langCount ? ' <strong>' + langCount + ' cards</strong> in your deck.' : '') + '</p>' +
    '</div>' +
    '<div style="text-align:center;margin-top:8px">' +
      '<button class="reset-btn" onclick="showTokenScreen()" title="Token settings" style="font-size:14px;padding:6px 14px">⚙ Settings</button>' +
    '</div>' +
  '</div>';
}

function renderSetup() {
  var hasSession = !!(S.token);
  var idlePills = '';
  if (hasSession) {
    [[30,'30s'],[60,'1 min'],[120,'2 min'],[300,'5 min'],[0,'Off']].forEach(function(opt) {
      idlePills += '<button class="fpill' + (S.idleTimeout === opt[0] ? ' active' : '') + '" onclick="setIdleTimeout(' + opt[0] + ')">' + opt[1] + '</button>';
    });
  }
  return '<div class="setup">' +
    '<h2>' + (hasSession ? 'Settings' : 'Welcome') + '</h2>' +
    '<p>Cards sync across devices via a private GitHub Gist.<br><br>' +
    'You need a <strong>classic</strong> GitHub token (starts with <code>ghp_</code>) with <strong>gist</strong> scope.<br><br>' +
    '1. Go to <a href="https://github.com/settings/tokens" target="_blank">github.com/settings/tokens</a><br>' +
    '2. Click <strong>Generate new token (classic)</strong><br>' +
    '3. Tick <strong>gist</strong> → Generate → copy the <code>ghp_…</code> token</p>' +
    (S.err ? '<div class="error-banner">' + esc(S.err) + '</div>' : '') +
    '<div class="form-group"><label>' + (hasSession ? 'New token (leave blank to keep current)' : 'GitHub Token (classic, ghp_…)') + '</label>' +
    '<input type="password" id="tok" placeholder="ghp_…" /></div>' +
    '<button class="btn btn-primary btn-full" id="conn-btn" onclick="connect()">' + (hasSession ? 'Switch token' : 'Connect') + '</button>' +
    (hasSession ?
      '<div style="margin-top:22px"><div class="form-group" style="margin-bottom:8px"><label>Auto-pause timer</label></div>' +
      '<div class="filter-pills">' + idlePills + '</div></div>' +
      '<button class="btn btn-full" style="margin-top:22px;background:var(--bg);color:var(--unknown);border:1px solid var(--unknown)" onclick="resetToken()">Disconnect</button>'
      : '') +
    '</div>';
}

function renderStudy() {
  var pool = filteredPool();
  var isSit = S.studyMode === 'situation';
  var isInt = S.studyMode === 'interview';
  var typeOk = isInt ? isInterview : (isSit ? isSituation : isVocab);
  var modeCards = S.cards.filter(typeOk);
  var total = modeCards.length;
  var labels = uniqueLabels(S.studyMode);

  // Shuffle progress: how many cards remain in this round
  var queueLeft = S.shuffleMode ? S.shuffleQueue.length : 0;
  var poolSize  = pool.length;

  var html = '<div class="study-area">';
  html += '<div id="saving-lbl" class="saving"></div>';
  if (S.err) html += '<div class="error-banner">' + esc(S.err) + '</div>';
  if (S.idleNote) html += '<div class="idle-banner">⏸ Timer paused — no activity for 1 min <button onclick="dismissIdle()">✕</button></div>';
  if (isInt && S.practiceMode) html += '<div class="practice-indicator">Practice mode — no scoring</div>';

  // Controls bar: filter pills + shuffle button
  if (total > 0) {
    html += '<div class="controls-bar"><div class="filter-pills">';
    html += '<button class="fpill' + (!S.filterLabel ? ' active' : '') + '" onclick="setFilter(\'\')">All (' + total + ')</button>';
    labels.forEach(function(lbl) {
      var cnt = modeCards.filter(function(c) { return c.label === lbl; }).length;
      html += '<button class="fpill' + (S.filterLabel === lbl ? ' active' : '') + '" onclick="setFilter(\'' + esc(lbl) + '\')">' + esc(lbl) + ' (' + cnt + ')</button>';
    });
    html += '</div>';

    // Difficulty + bookmark filters for interview mode
    if (isInt) {
      html += '<div class="diff-filter-row">';
      ['', 'easy', 'medium', 'hard'].forEach(function(d) {
        var lbl = d ? d.charAt(0).toUpperCase() + d.slice(1) : 'All levels';
        html += '<button class="fpill' + (S.difficultyFilter === d ? ' active' : '') + '" onclick="setDifficultyFilter(\'' + d + '\')">' + lbl + '</button>';
      });
      var bmCount = modeCards.filter(function(c) { return c.bookmarked; }).length;
      html += '<button class="fpill' + (S.bookmarkFilter ? ' active' : '') + '" onclick="toggleBookmarkFilter()">★ ' + bmCount + '</button>';
      html += '</div>';
    }

    html += '<div class="controls-actions">';
    html += '<button class="shuffle-btn' + (S.shuffleMode ? ' active' : '') + '" onclick="toggleShuffle()">⇄ Shuffle</button>';
    if (isInt) {
      html += '<button class="shuffle-btn' + (S.practiceMode ? ' active' : '') + '" onclick="togglePractice()">Practice</button>';
    }
    if (!isSit && !isInt) {
      html += '<button class="shuffle-btn' + (S.direction === 'ru-en' ? ' active' : '') + '" onclick="toggleDirection()" title="Flip card direction">' + (S.direction === 'en-ru' ? 'EN→RU' : 'RU→EN') + '</button>';
    }
    html += '</div></div>';
  }

  // Shuffle progress bar
  if (S.shuffleMode && poolSize > 0) {
    var done = poolSize - queueLeft;
    var pct = Math.round((done / poolSize) * 100);
    html += '<div class="progress-wrap"><div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:' + pct + '%"></div></div><span class="progress-count">' + done + ' / ' + poolSize + '</span></div>';
  }

  // Session stats (hidden in practice mode)
  if (pool.length > 0 && !(isInt && S.practiceMode)) {
    html += '<div class="stats-bar">' +
      '<span class="session-pill">' +
        '<span class="s-k">✓' + S.sessionKnown + '</span>' +
        '<span class="session-sep"> / </span>' +
        '<span class="s-u">✗' + S.sessionUnknown + '</span>' +
      '</span>' +
      '<button class="reset-session-btn" onclick="resetSession()" title="Restart session count">↺</button>' +
      '</div>';
  }

  // Session progress bar
  var allInScope = S.filterLabel
    ? modeCards.filter(function(c) { return c.label === S.filterLabel; })
    : modeCards;
  var sessionDone = !pool.length && allInScope.length > 0;
  var sessionTotal = S.sessionKnown + S.sessionUnknown;
  if (sessionTotal > 0 && allInScope.length > 0) {
    var progressPct = Math.round((sessionTotal / allInScope.length) * 100);
    html += '<div class="session-progress">' +
      '<div class="session-progress-bar"><div class="session-progress-fill" style="width:' + Math.min(progressPct, 100) + '%"></div></div>' +
      '<span class="session-progress-text">' + sessionTotal + '/' + allInScope.length + '</span>' +
    '</div>';
  }

  var emptyMsg = isInt
    ? '<h3>No interview questions yet</h3><p>Go to Cards tab, pick <strong>Interview</strong> type and add questions, or import a question bank.</p>'
    : isSit
    ? '<h3>No situations yet</h3><p>Go to Cards tab, pick <strong>Situation</strong> type and add some.</p>'
    : '<h3>No cards yet</h3><p>Go to Cards tab to add words.</p>';

  if (!S.current || !pool.find(function(c) { return c.id === S.current.id; })) {
    if (sessionDone) {
      html += '<div class="empty-state"><h3>All done!</h3><p>You knew every card. Tap ↺ to start over.</p></div>';
    } else if (!pool.length && S.filterLabel) {
      html += '<div class="empty-state"><h3>No cards in "' + esc(S.filterLabel) + '"</h3><p>Add some cards with this label in the Cards tab.</p></div>';
    } else {
      html += '<div class="empty-state">' + emptyMsg + '</div>';
    }
  } else {
    var c = S.current;
    var frontLang, backLang, frontWord, backWord, wordClassFront, wordClassBack;
    if (isInt) {
      frontLang = 'Question';
      backLang  = 'Answer';
      frontWord = c.english;
      backWord  = c.russian;
      wordClassFront = 'card-word card-word-question';
      wordClassBack  = 'card-word card-word-long';
    } else if (isSit) {
      frontLang = 'Situation'; backLang = 'Feeling';
      frontWord = c.english;   backWord = c.russian;
      wordClassFront = 'card-word'; wordClassBack = 'card-word';
    } else {
      frontLang = S.direction === 'en-ru' ? 'English' : 'Russian';
      backLang  = S.direction === 'en-ru' ? 'Russian'  : 'English';
      frontWord = S.direction === 'en-ru' ? c.english  : c.russian;
      backWord  = S.direction === 'en-ru' ? c.russian  : c.english;
      wordClassFront = 'card-word'; wordClassBack = 'card-word';
    }

    var cardClass = 'card' + (S.flipped ? ' flipped' : '') + (isInt ? ' interview-card' : '');

    // Card badges (label + difficulty)
    var badgesHtml = '';
    if (isInt) {
      var diff = c.difficulty || 'medium';
      badgesHtml = '<div class="card-badges">';
      if (c.label) badgesHtml += '<span class="label-badge int-badge">' + esc(c.label) + '</span>';
      badgesHtml += '<span class="label-badge diff-' + diff + '">' + diff + '</span>';
      badgesHtml += '</div>';
    } else if (c.label) {
      badgesHtml = '<div class="card-tag">' + esc(c.label) + '</div>';
    }

    html += '<div class="card-container">';
    // Swipe hint overlays (shown during swipe gesture)
    if (S.flipped) {
      if (isInt && !S.practiceMode) {
        html += '<div class="swipe-hint swipe-hint-right">Nailed it</div>';
        html += '<div class="swipe-hint swipe-hint-left">Failed</div>';
        html += '<div class="swipe-hint swipe-hint-up">Partially</div>';
      } else if (!isInt) {
        html += '<div class="swipe-hint swipe-hint-right">Know it</div>';
        html += '<div class="swipe-hint swipe-hint-left">Don\'t know</div>';
      }
    }
    // Bookmark button for interview cards
    if (isInt) {
      html += '<button class="bookmark-icon' + (c.bookmarked ? ' active' : '') + '" onclick="event.stopPropagation();toggleBookmark(\'' + c.id + '\')" title="Bookmark">' + (c.bookmarked ? '★' : '☆') + '</button>';
    }
    html += '<div class="' + cardClass + '" onclick="flip()" id="fc">' +
        '<div class="card-face">' +
          '<div class="card-lang">' + frontLang + '</div>' +
          '<div class="' + wordClassFront + '">' + esc(frontWord) + '</div>' +
          badgesHtml +
          '<div class="card-hint">tap to reveal</div>' +
        '</div>' +
        '<div class="card-face card-back">' +
          '<div class="card-lang">' + backLang + '</div>' +
          '<div class="' + wordClassBack + '">' + esc(backWord) + '</div>' +
          (isInt && c.resource ? '<div class="card-resource"><a href="' + esc(c.resource) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">📖 Learn more</a></div>' : '') +
        '</div>' +
      '</div></div>';

    if (S.flipped) {
      if (isInt && S.practiceMode) {
        // Practice mode: just Next, no scoring
        html += '<button class="btn btn-primary btn-full" onclick="practiceNext()">Next →</button>';
      } else if (isInt) {
        // Interview: 3-level confidence
        html += '<div class="action-row-3">' +
          '<button class="btn btn-unknown" onclick="markInterview(\'failed\')">✗ Failed</button>' +
          '<button class="btn btn-partial" onclick="markInterview(\'partial\')">~ Partially</button>' +
          '<button class="btn btn-known" onclick="markInterview(\'nailed\')">✓ Nailed it</button>' +
          '</div>';
      } else {
        html += '<div class="action-row">' +
          '<button class="btn btn-unknown" onclick="markCard(false)">✗ Don\'t know</button>' +
          '<button class="btn btn-known" onclick="markCard(true)">✓ Know it</button>' +
          '</div>';
      }
    } else {
      html += '<button class="skip-btn" onclick="skip()">Skip →</button>';
    }
  }
  html += renderStopwatch();
  html += '</div>';
  return html;
}

function renderStopwatch() {
  return '<div class="stopwatch">' +
    '<span class="stopwatch-time" id="sw-display">' + fmtTime(swCurrentMs()) + '</span>' +
    '<button class="sw-btn' + (S.swRunning ? ' running' : '') + '" onclick="swToggle()">' + (S.swRunning ? 'Pause' : 'Start') + '</button>' +
    '<button class="sw-btn" onclick="swReset()">Reset</button>' +
    '</div>';
}

function renderManage() {
  var isIntMode = S.appMode === 'interview';

  // Scope cards to current app mode
  var modePool = isIntMode
    ? S.cards.filter(isInterview)
    : S.cards.filter(function(c) { return isVocab(c) || isSituation(c); });

  // Within language mode, apply sub-type filter
  var mtf = S.manageTypeFilter;
  var typePool;
  if (isIntMode) {
    typePool = modePool; // no sub-type filter in interview mode
  } else {
    typePool = mtf === 'situation' ? modePool.filter(isSituation)
             : mtf === 'vocab'     ? modePool.filter(isVocab)
             : modePool;
  }

  var labelFilter = isIntMode ? 'interview' : (mtf || null);
  var labels = uniqueLabels(labelFilter);
  var displayCards = S.manageFilter
    ? typePool.filter(function(c) { return c.label === S.manageFilter; })
    : typePool;
  var sorted = displayCards.slice().sort(function(a,b){ return (b.unknown||0)-(a.unknown||0); });

  var isSit = S.addType === 'situation';
  var isIntAdd = S.addType === 'interview';
  var fldA = isIntAdd ? 'Question' : (isSit ? 'Situation' : 'English');
  var fldB = isIntAdd ? 'Answer'   : (isSit ? 'Feeling / Response' : 'Russian');
  var phA  = isIntAdd ? 'What is a Kubernetes Pod?' : (isSit ? 'the shop is closed' : 'to procrastinate');
  var phB  = isIntAdd ? 'A Pod is the smallest deployable unit in Kubernetes...' : (isSit ? 'frustrating' : 'откладывать');

  var html = '<div class="manage-area">';
  html += '<div id="saving-lbl" class="saving"></div>';
  if (S.err) html += '<div class="error-banner">' + esc(S.err) + '</div>';

  // Add card form — type tabs scoped to mode
  html += '<div class="add-form"><h3>' + (isIntMode ? 'Add question' : 'Add card') + '</h3>';

  if (!isIntMode) {
    // Language mode: Vocab/Situation tabs
    html += '<div style="display:flex;gap:6px;margin-bottom:14px">' +
      '<button class="fpill' + (S.addType === 'vocab' ? ' active' : '') + '" onclick="setAddType(\'vocab\')">Vocab</button>' +
      '<button class="fpill' + (isSit ? ' active' : '') + '" onclick="setAddType(\'situation\')">Situation</button>' +
    '</div>';
  }

  html += '<div class="form-row">' +
      '<div class="form-group"><label>' + fldA + '</label><input id="inp-en" type="text" placeholder="' + phA + '" /></div>' +
    '</div>' +
    '<div class="form-row">' +
      '<div class="form-group"><label>' + fldB + '</label>' +
        (isIntAdd ? '<textarea id="inp-ru" class="import-textarea" style="min-height:80px" placeholder="' + esc(phB) + '"></textarea>'
                  : '<input id="inp-ru" type="text" placeholder="' + phB + '" />') +
      '</div>' +
    '</div>';

  // Difficulty selector for interview cards
  if (isIntAdd) {
    html += '<div class="form-group"><label>Difficulty</label>' +
      '<div style="display:flex;gap:6px">' +
        '<button class="fpill' + (S._addDifficulty === 'easy' ? ' active' : '') + '" onclick="S._addDifficulty=\'easy\';render()">Easy</button>' +
        '<button class="fpill' + ((!S._addDifficulty || S._addDifficulty === 'medium') ? ' active' : '') + '" onclick="S._addDifficulty=\'medium\';render()">Medium</button>' +
        '<button class="fpill' + (S._addDifficulty === 'hard' ? ' active' : '') + '" onclick="S._addDifficulty=\'hard\';render()">Hard</button>' +
      '</div></div>';
  }

  html += '<div class="form-group"><label>' + (isIntAdd ? 'Topic' : 'Label') + ' <span style="font-weight:400;text-transform:none">(optional)</span></label>' +
    '<input id="inp-lbl" type="text" list="label-suggestions" placeholder="' + (isIntAdd ? 'e.g. Kubernetes' : 'e.g. emotions') + '" />' +
    '<datalist id="label-suggestions">' + uniqueLabels(S.addType).map(function(l) { return '<option value="' + esc(l) + '">'; }).join('') + '</datalist>' +
    '</div>' +
    (isIntAdd ? '<div class="form-group"><label>Resource link <span style="font-weight:400;text-transform:none">(optional)</span></label>' +
      '<input id="inp-resource" type="url" placeholder="https://kubernetes.io/docs/..." /></div>' : '') +
    '<button class="btn btn-primary btn-full" onclick="submitCard()">Add</button>' +
    (S.addMsg ? '<div class="' + (S.addMsg[0] === '✓' ? 'import-msg-ok' : 'import-msg-err') + '" style="margin-top:10px">' + esc(S.addMsg) + '</div>' : '') +
    '</div>';

  // Import panel
  var importPlaceholder = isIntMode
    ? '[{"question": "What is a Pod?", "answer": "A Pod is...", "label": "Kubernetes", "type": "interview"}]'
    : '[{"english": "to procrastinate", "russian": "откладывать", "label": "verb"}]';
  var importHelp = isIntMode
    ? '<code>[{"question":"...","answer":"...","label":"Topic","type":"interview","difficulty":"medium"}, ...]</code>'
    : '<code>[{"english":"word","russian":"слово","label":"noun"}, ...]</code>';

  html += '<div class="import-panel">' +
    '<div class="import-header" onclick="toggleImport()">' +
      '<span>Import JSON</span>' +
      '<span class="chevron' + (S.importOpen ? ' open' : '') + '">▼</span>' +
    '</div>';
  if (S.importOpen) {
    html += '<div class="import-body">' +
      '<p>Format: ' + importHelp + '<br>Duplicates are skipped.</p>' +
      '<label class="import-file-btn">📂 Choose JSON file<input type="file" accept=".json" style="display:none" onchange="handleFileImport(this)"></label>' +
      '<div class="import-or">— or paste JSON below —</div>' +
      '<textarea class="import-textarea" id="import-txt" placeholder=\'' + importPlaceholder + '\'></textarea>' +
      '<button class="btn btn-primary btn-full" style="margin-top:10px" onclick="importFromTextarea()">Import</button>' +
      (S.importMsg ? '<div class="' + (S.importMsg[0] === '✓' ? 'import-msg-ok' : 'import-msg-err') + '">' + esc(S.importMsg) + '</div>' : '') +
    '</div>';

  // Type + label filters — scoped to mode

  if (isIntMode) {

  } else {
    // Language mode: Vocab/Situation tabs
    html += '<div class="filter-pills">' +
      '<button class="fpill' + (!mtf ? ' active' : '') + '" onclick="setManageTypeFilter(\'\')">All (' + modePool.length + ')</button>' +
      '<button class="fpill' + (mtf === 'vocab' ? ' active' : '') + '" onclick="setManageTypeFilter(\'vocab\')">Vocab (' + modePool.filter(isVocab).length + ')</button>' +
      '<button class="fpill' + (mtf === 'situation' ? ' active' : '') + '" onclick="setManageTypeFilter(\'situation\')">Situations (' + modePool.filter(isSituation).length + ')</button>' +
    '</div>';
  }

  if (labels.length > 0) {
    html += '<div class="manage-filter">' +
      '<button class="fpill' + (!S.manageFilter ? ' active' : '') + '" onclick="setManageFilter(\'\')">All ' + (isIntMode ? 'topics' : 'labels') + '</button>';
    labels.forEach(function(lbl) {
      html += '<button class="fpill' + (S.manageFilter === lbl ? ' active' : '') + '" onclick="setManageFilter(\'' + esc(lbl) + '\')">' + esc(lbl) + '</button>';
    });
    html += '</div>';
  }
  html += '</div>';

  var PAGE_SIZE = 20;
  var totalPages = Math.max(1, Math.ceil(sorted.length / PAGE_SIZE));
  var page = Math.min(Math.max(S.managePage, 0), totalPages - 1);
  var pageCards = sorted.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE);

  html += '<div class="cards-list">';
  if (!sorted.length) {
    html += '<div class="empty-state" style="padding:32px 0"><p>' + (S.manageFilter ? 'No cards with this label.' : 'No cards yet.') + '</p></div>';
  } else {
    pageCards.forEach(function(c) {
      var isIntCard = c.type === 'interview';
      var diff = c.difficulty || 'medium';
      html += '<div class="card-item">' +
        '<div class="card-item-text">' +
          '<div class="card-item-en">' + esc(c.english) + '</div>' +
          '<div class="card-item-ru">' + esc(c.russian) + '</div>' +
          '<div class="card-item-meta">' +
            (c.type === 'situation' ? '<span class="label-badge sit-badge">situation</span>' : '') +
            (isIntCard ? '<span class="label-badge int-badge">interview</span>' : '') +
            (isIntCard ? '<span class="label-badge diff-' + diff + '">' + diff + '</span>' : '') +
            (c.label ? '<span class="label-badge">' + esc(c.label) + '</span>' : '') +
          '</div>' +
        '</div>' +
        (isIntCard ? '<button class="bookmark-list-btn' + (c.bookmarked ? ' active' : '') + '" onclick="toggleBookmark(\'' + c.id + '\')">' + (c.bookmarked ? '★' : '☆') + '</button>' : '') +
        '<div class="card-item-score"><span class="s-k">✓' + (c.known||0) + '</span> <span class="s-u">✗' + (c.unknown||0) + '</span></div>' +
        '<button class="del-btn" onclick="delCard(\'' + c.id + '\')">×</button>' +
        '</div>';
    });
  }
  html += '</div>';

  if (totalPages > 1) {
    html += '<div class="pagination">' +
      '<button class="page-btn" onclick="setManagePage(' + (page - 1) + ')"' + (page === 0 ? ' disabled' : '') + '>←</button>' +
      '<span class="page-info">' + (page + 1) + ' / ' + totalPages + '</span>' +
      '<button class="page-btn" onclick="setManagePage(' + (page + 1) + ')"' + (page >= totalPages - 1 ? ' disabled' : '') + '>→</button>' +
      '</div>';
  }

  html += '</div>';
  return html;
}

// ── Statistics ────────────────────────────────────────────────────────────────

function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}

function recordSession() {
  if (swCurrentMs() === 0) return;
  stats.push({
    date:    todayStr(),
    duration: swCurrentMs(),
    known:   S.sessionKnown,
    unknown: S.sessionUnknown,
    mode:    S.studyMode
  });
  localStorage.setItem('fc_stats', JSON.stringify(stats));
}

function aggregateStats(period, mode) {
  var days = [];
  var now = new Date();
  for (var i = period - 1; i >= 0; i--) {
    var d = new Date(now);
    d.setDate(d.getDate() - i);
    days.push(d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()));
  }
  var byDate = {};
  days.forEach(function(dt) { byDate[dt] = { date: dt, duration: 0, known: 0, unknown: 0, sessions: 0 }; });
  stats.forEach(function(r) {
    if (!byDate[r.date]) return;
    if (mode && r.mode !== mode) return;
    byDate[r.date].duration += r.duration;
    byDate[r.date].known    += r.known;
    byDate[r.date].unknown  += r.unknown;
    byDate[r.date].sessions += 1;
  });
  return days.map(function(dt) { return byDate[dt]; });
}

function fmtDateLabel(dateStr, period) {
  var parts = dateStr.split('-');
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[parseInt(parts[1], 10) - 1] + ' ' + parseInt(parts[2], 10);
}

function buildChartSVG(days, metric) {
  var W = 400, H = 220;
  var ml = 38, mr = 8, mt = 10, mb = 32;
  var cw = W - ml - mr, ch = H - mt - mb;

  var vals = days.map(function(d) {
    if (metric === 'time') return Math.round(d.duration / 60000);
    return d.known + d.unknown;
  });
  var valsK = days.map(function(d) { return d.known; });
  var valsU = days.map(function(d) { return d.unknown; });

  var maxVal = metric === 'time'
    ? Math.max(1, Math.max.apply(null, vals))
    : Math.max(1, Math.max.apply(null, valsK.concat(valsU)));

  var n = days.length;
  function xOf(i) { return ml + (n <= 1 ? cw / 2 : i * cw / (n - 1)); }
  function yOf(v) { return mt + ch - (v / maxVal) * ch; }

  var svg = '<svg width="100%" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" style="display:block;overflow:visible">';

  // Grid lines + Y labels
  var gridSteps = 4;
  for (var gi = 0; gi <= gridSteps; gi++) {
    var gv = Math.round((maxVal / gridSteps) * gi);
    var gy = yOf(gv);
    svg += '<line x1="' + ml + '" y1="' + gy + '" x2="' + (W - mr) + '" y2="' + gy + '" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,3"/>';
    svg += '<text x="' + (ml - 4) + '" y="' + (gy + 4) + '" text-anchor="end" font-size="10" fill="var(--text-muted)">' + gv + '</text>';
  }

  // Zero line
  svg += '<line x1="' + ml + '" y1="' + (mt + ch) + '" x2="' + (W - mr) + '" y2="' + (mt + ch) + '" stroke="var(--border)" stroke-width="1"/>';

  var allZero = vals.every(function(v) { return v === 0; });

  if (allZero) {
    svg += '<text x="' + (W / 2) + '" y="' + (H / 2) + '" text-anchor="middle" font-size="13" fill="var(--text-muted)">No data yet</text>';
  } else if (metric === 'time') {
    // Single blue line
    var pts = days.map(function(d, i) { return xOf(i) + ',' + yOf(Math.round(d.duration / 60000)); }).join(' ');
    svg += '<polyline points="' + pts + '" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linejoin="round"/>';
    days.forEach(function(d, i) {
      var v = Math.round(d.duration / 60000);
      if (v > 0) svg += '<circle cx="' + xOf(i) + '" cy="' + yOf(v) + '" r="3" fill="var(--primary)"/>';
    });
  } else {
    // Known line (green)
    var ptsK = days.map(function(d, i) { return xOf(i) + ',' + yOf(d.known); }).join(' ');
    svg += '<polyline points="' + ptsK + '" fill="none" stroke="var(--known)" stroke-width="2" stroke-linejoin="round"/>';
    days.forEach(function(d, i) {
      if (d.known > 0) svg += '<circle cx="' + xOf(i) + '" cy="' + yOf(d.known) + '" r="3" fill="var(--known)"/>';
    });
    // Unknown line (red)
    var ptsU = days.map(function(d, i) { return xOf(i) + ',' + yOf(d.unknown); }).join(' ');
    svg += '<polyline points="' + ptsU + '" fill="none" stroke="var(--unknown)" stroke-width="2" stroke-linejoin="round"/>';
    days.forEach(function(d, i) {
      if (d.unknown > 0) svg += '<circle cx="' + xOf(i) + '" cy="' + yOf(d.unknown) + '" r="3" fill="var(--unknown)"/>';
    });
  }

  // X-axis labels
  var step = n > 30 ? 5 : (n > 14 ? 2 : 1);
  days.forEach(function(d, i) {
    if (i % step !== 0 && i !== n - 1) return;
    svg += '<text x="' + xOf(i) + '" y="' + (mt + ch + 18) + '" text-anchor="middle" font-size="9" fill="var(--text-muted)">' + fmtDateLabel(d.date, n) + '</text>';
  });

  svg += '</svg>';
  return svg;
}

function renderStats() {
  var isIntMode = S.appMode === 'interview';
  var period = S.statsPeriod;
  var mode   = S.statsMode;
  var metric = S.statsMetric;

  // In interview mode, force stats to interview; in language mode, filter only language modes
  var effectiveMode = isIntMode ? (mode || 'interview') : mode;
  var days = aggregateStats(period, effectiveMode);

  var totalSessions = 0, totalMs = 0, totalKnown = 0, totalUnknown = 0;
  var filtered = stats.filter(function(r) {
    if (isIntMode) return !effectiveMode || r.mode === effectiveMode;
    if (effectiveMode) return r.mode === effectiveMode;
    return r.mode !== 'interview'; // language mode: exclude interview stats
  });
  var cutoff = days[0].date;
  filtered.forEach(function(r) {
    if (r.date < cutoff) return;
    totalSessions++;
    totalMs      += r.duration;
    totalKnown   += r.known;
    totalUnknown += r.unknown;
  });
  var totalMins = Math.round(totalMs / 60000);

  var html = '<div class="stats-area">';
  html += '<div id="saving-lbl" class="saving"></div>';

  // Period filters
  html += '<div class="filter-pills">';
  [7, 14, 30, 60].forEach(function(p) {
    html += '<button class="fpill' + (period === p ? ' active' : '') + '" onclick="setStatsPeriod(' + p + ')">' + p + 'd</button>';
  });

  // Mode sub-filters scoped to app mode
  if (isIntMode) {
    // Interview mode: no sub-filters needed (always interview)
  } else {
    // Language mode: All / Vocab / Situations
    html += '<button class="fpill' + (!mode ? ' active' : '') + '" onclick="setStatsMode(\'\')">All</button>';
    html += '<button class="fpill' + (mode === 'vocab' ? ' active' : '') + '" onclick="setStatsMode(\'vocab\')">Vocab</button>';
    html += '<button class="fpill' + (mode === 'situation' ? ' active' : '') + '" onclick="setStatsMode(\'situation\')">Situations</button>';
  }
  html += '</div>';

  // Metric toggle
  html += '<div class="metric-tabs">';
  html += '<button class="fpill' + (metric === 'cards' ? ' active' : '') + '" onclick="setStatsMetric(\'cards\')">Cards</button>';
  html += '<button class="fpill' + (metric === 'time' ? ' active' : '') + '" onclick="setStatsMetric(\'time\')">Time (min)</button>';
  html += '</div>';

  // Chart
  html += '<div class="chart-wrap">';
  html += '<div class="chart-title">' + (metric === 'time' ? 'Minutes studied per day' : 'Cards per day') + '</div>';
  html += buildChartSVG(days, metric);
  if (metric === 'cards') {
    html += '<div class="chart-legend">' +
      '<span><span class="legend-dot" style="background:var(--known)"></span>Known</span>' +
      '<span><span class="legend-dot" style="background:var(--unknown)"></span>Don\'t know</span>' +
      '</div>';
  } else {
    html += '<div class="chart-legend"><span><span class="legend-dot" style="background:var(--primary)"></span>Minutes</span></div>';
  }
  html += '</div>';

  // Summary cards
  var totalAnswers = totalKnown + totalUnknown;
  var pctCorrect = totalAnswers > 0 ? Math.round((totalKnown / totalAnswers) * 100) : 0;
  html += '<div class="summary-row">';
  html += '<div class="summary-card"><span class="s-val">' + totalSessions + '</span><span class="s-lbl">Sessions</span></div>';
  html += '<div class="summary-card"><span class="s-val">' + totalMins + '</span><span class="s-lbl">Minutes</span></div>';
  html += '<div class="summary-card"><span class="s-val s-k">' + totalKnown + '</span><span class="s-lbl">Known</span></div>';
  html += '<div class="summary-card"><span class="s-val s-u">' + totalUnknown + '</span><span class="s-lbl">Unknown</span></div>';
  html += '<div class="summary-card"><span class="s-val" style="color:var(--primary)">' + pctCorrect + '%</span><span class="s-lbl">Correct</span></div>';
  html += '</div>';

  html += '</div>';
  return html;
}

// ── Idle auto-pause ───────────────────────────────────────────────────────────

var idleTimer    = null;
var lastActivity = 0;

function resetIdleTimer() {
  lastActivity = Date.now();
  if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
  if (S.swRunning && S.idleTimeout > 0) {
    idleTimer = setTimeout(idlePause, S.idleTimeout * 1000);
  }
}

function clearIdleTimer() {
  if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
}

function idlePause() {
  if (!S.swRunning) return;
  // Trim elapsed to last activity — don't count idle minutes in stats
  S.swElapsed = S.swElapsed + (lastActivity - S.swStarted);
  S.swRunning = false;
  clearInterval(swTimer);
  swTimer = null;
  idleTimer = null;
  recordSession();
  S.idleNote = true;
  render();
}

// ── Stopwatch ─────────────────────────────────────────────────────────────────

var swTimer = null;

function swCurrentMs() {
  if (!S.swRunning) return S.swElapsed;
  return S.swElapsed + (Date.now() - S.swStarted);
}

function fmtTime(ms) {
  var total = Math.floor(ms / 1000);
  var h = Math.floor(total / 3600);
  var m = Math.floor((total % 3600) / 60);
  var s = total % 60;
  if (h > 0) return pad(h) + ':' + pad(m) + ':' + pad(s);
  return pad(m) + ':' + pad(s);
}

function pad(n) { return n < 10 ? '0' + n : '' + n; }

function swTick() {
  var el = document.getElementById('sw-display');
  if (el) el.textContent = fmtTime(swCurrentMs());
}

function swToggle() {
  if (S.swRunning) {
    S.swElapsed = swCurrentMs();
    S.swRunning = false;
    clearInterval(swTimer);
    swTimer = null;
    clearIdleTimer();
    recordSession();
  } else {
    S.swStarted = Date.now();
    S.swRunning = true;
    S.idleNote = false;
    swTimer = setInterval(swTick, 500);
    resetIdleTimer();
  }
  render();
}

function swReset() {
  clearIdleTimer();
  recordSession();
  S.swRunning = false;
  S.swElapsed = 0;
  S.swStarted = 0;
  S.idleNote = false;
  clearInterval(swTimer);
  swTimer = null;
  render();
}

function parseImportJSON(text) {
  var data = JSON.parse(text);
  if (Array.isArray(data)) return data;
  if (data && Array.isArray(data.cards)) return data.cards;
  throw new Error('Expected an array or {"cards": [...]}');
}

function doImport(raw) {
  var items;
  try { items = parseImportJSON(raw); }
  catch(e) { S.importMsg = '✗ Invalid JSON: ' + e.message; render(); return; }

  var added = 0, skipped = 0;
  items.forEach(function(c) {
    // Accept question/answer as aliases for english/russian
    var en = c.english || c.question;
    var ru = c.russian || c.answer;
    if (!en || !ru) { skipped++; return; }
    var importType = c.type === 'situation' ? 'situation'
                   : c.type === 'interview' ? 'interview'
                   : 'vocab';
    var preserveCase = (importType === 'situation' || importType === 'interview');
    var enNorm = preserveCase ? en.trim() : en.trim().toLowerCase();
    var dup = S.cards.some(function(x) {
      return x.type === importType && x.english.toLowerCase() === enNorm.toLowerCase();
    });
    if (dup) { skipped++; return; }
    var ruVal = preserveCase ? ru.trim() : ru.trim().toLowerCase();
    var card = { id: uid(), english: enNorm, russian: ruVal, label: (c.label || '').trim(), known: 0, unknown: 0, type: importType };
    if (importType === 'interview') {
      card.difficulty = c.difficulty || 'medium';
      card.bookmarked = !!c.bookmarked;
      if (c.resource) card.resource = c.resource.trim();
    }
    S.cards.push(card);
    added++;
  });

  if (!added && !skipped) { S.importMsg = '✗ No valid cards found in the file'; render(); return; }
  S.importMsg = '✓ Imported ' + added + ' card' + (added !== 1 ? 's' : '') + (skipped ? ', skipped ' + skipped + ' duplicates' : '');
  if (!S.current) S.current = nextCard();
  scheduleSave();
  render();
}

function importFromTextarea() {
  var el = document.getElementById('import-txt');
  if (!el || !el.value.trim()) { S.importMsg = '✗ Paste some JSON first'; render(); return; }
  doImport(el.value.trim());
}

function handleFileImport(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) { doImport(e.target.result); };
  reader.onerror = function() { S.importMsg = '✗ Could not read file'; render(); };
  reader.readAsText(file);
}

// ── Swipe gestures ────────────────────────────────────────────────────────────

var swipeState = { startX: 0, startY: 0, swiping: false };
var SWIPE_THRESHOLD = 60;

function initSwipe() {
  var root = document.getElementById('root');
  if (!root) return;
  root.addEventListener('touchstart', onTouchStart, { passive: true });
  root.addEventListener('touchmove', onTouchMove, { passive: false });
  root.addEventListener('touchend', onTouchEnd, { passive: true });
}

function onTouchStart(e) {
  if (!S.flipped || S.view !== 'study') return;
  var card = document.getElementById('fc');
  if (!card) return;
  var t = e.touches[0];
  swipeState.startX = t.clientX;
  swipeState.startY = t.clientY;
  swipeState.swiping = true;
  var container = card.closest('.card-container');
  if (container) container.classList.add('swiping');
}

function onTouchMove(e) {
  if (!swipeState.swiping) return;
  var card = document.getElementById('fc');
  if (!card) return;
  var t = e.touches[0];
  var dx = t.clientX - swipeState.startX;
  var dy = t.clientY - swipeState.startY;
  // Slight card tilt during swipe
  card.style.transform = 'rotateY(180deg) translate(' + (dx * 0.3) + 'px,' + (dy * 0.3) + 'px)';
  // Show swipe hints
  var container = card.closest('.card-container');
  if (!container) return;
  var hints = container.querySelectorAll('.swipe-hint');
  hints.forEach(function(h) { h.classList.remove('visible'); });
  if (dx > SWIPE_THRESHOLD / 2) {
    var rh = container.querySelector('.swipe-hint-right');
    if (rh) rh.classList.add('visible');
  } else if (dx < -SWIPE_THRESHOLD / 2) {
    var lh = container.querySelector('.swipe-hint-left');
    if (lh) lh.classList.add('visible');
  } else if (dy < -SWIPE_THRESHOLD / 2) {
    var uh = container.querySelector('.swipe-hint-up');
    if (uh) uh.classList.add('visible');
  }
  if (Math.abs(dx) > 10 || Math.abs(dy) > 10) e.preventDefault();
}

function onTouchEnd(e) {
  if (!swipeState.swiping) return;
  swipeState.swiping = false;
  var card = document.getElementById('fc');
  if (card) card.style.transform = '';
  var container = card ? card.closest('.card-container') : null;
  if (container) container.classList.remove('swiping');

  var t = e.changedTouches[0];
  var dx = t.clientX - swipeState.startX;
  var dy = t.clientY - swipeState.startY;
  var isInt = S.studyMode === 'interview';

  if (Math.abs(dx) > SWIPE_THRESHOLD && Math.abs(dx) > Math.abs(dy)) {
    if (dx > 0) {
      // Swipe right = Know it / Nailed it
      if (isInt && !S.practiceMode) markInterview('nailed');
      else if (!isInt) markCard(true);
      else practiceNext();
    } else {
      // Swipe left = Don't know / Failed
      if (isInt && !S.practiceMode) markInterview('failed');
      else if (!isInt) markCard(false);
      else practiceNext();
    }
  } else if (dy < -SWIPE_THRESHOLD && Math.abs(dy) > Math.abs(dx)) {
    // Swipe up = Partially (interview only)
    if (isInt && !S.practiceMode) markInterview('partial');
    else skip();
  } else if (dy > SWIPE_THRESHOLD && Math.abs(dy) > Math.abs(dx)) {
    // Swipe down = Skip
    skip();
  }
}

// ── Keyboard shortcuts ───────────────────────────────────────────────────────

document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (S.view !== 'study' || !S.current) return;

  var isInt = S.studyMode === 'interview';
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    if (!S.flipped) flip();
    else if (isInt && S.practiceMode) practiceNext();
  } else if (e.code === 'ArrowRight') {
    e.preventDefault();
    if (S.flipped) {
      if (isInt && !S.practiceMode) markInterview('nailed');
      else if (!isInt) markCard(true);
      else practiceNext();
    } else skip();
  } else if (e.code === 'ArrowLeft') {
    e.preventDefault();
    if (S.flipped) {
      if (isInt && !S.practiceMode) markInterview('failed');
      else if (!isInt) markCard(false);
      else practiceNext();
    }
  } else if (e.code === 'ArrowUp' && S.flipped) {
    e.preventDefault();
    if (isInt && !S.practiceMode) markInterview('partial');
  } else if (e.code === 'ArrowDown') {
    e.preventDefault();
    skip();
  } else if (e.key === '1' && S.flipped && isInt && !S.practiceMode) {
    markInterview('failed');
  } else if (e.key === '2' && S.flipped && isInt && !S.practiceMode) {
    markInterview('partial');
  } else if (e.key === '3' && S.flipped && isInt && !S.practiceMode) {
    markInterview('nailed');
  }
});

// ── Pull to refresh ──────────────────────────────────────────────────────────

var ptrState = { startY: 0, pulling: false };

function initPullToRefresh() {
  var root = document.getElementById('root');
  if (!root) return;
  root.addEventListener('touchstart', function(e) {
    if (window.scrollY === 0 && S.view === 'study' && S.token && S.gistId) {
      ptrState.startY = e.touches[0].clientY;
      ptrState.pulling = true;
    }
  }, { passive: true });
  root.addEventListener('touchend', function(e) {
    if (!ptrState.pulling) return;
    ptrState.pulling = false;
    var dy = e.changedTouches[0].clientY - ptrState.startY;
    if (dy > 100 && window.scrollY === 0) {
      var el = document.getElementById('saving-lbl');
      if (el) el.textContent = 'Refreshing…';
      loadGist().then(function() {
        S.current = nextCard();
        render();
      }).catch(function(err) {
        S.err = err.message;
        render();
      });
    }
  }, { passive: true });
}

// ── Init ──────────────────────────────────────────────────────────────────────

(function() {
  updateNav();
  initSwipe();
  initPullToRefresh();
  if (S.token && S.gistId) {
    loadGist()
      .then(function() { S.current = nextCard(); render(); })
      .catch(function(e) { S.err = e.message; render(); });
  } else if (S.token) {
    initGist()
      .then(function() { S.current = nextCard(); render(); })
      .catch(function(e) { S.err = e.message; render(); });
  } else {
    render();
  }
})();
</script>
